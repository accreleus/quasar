name: CI

# Runs on every pull request. The 2026-07-06 manual-only directive was a COST
# decision: automatic triggers exhausted a private account's Actions minutes.
# Public repositories get them free, and the tradeoff inverted on 2026-08-31 —
# an open repo where nobody can tell whether an incoming change compiles is the
# worse failure. These three jobs are the required checks for a merge to main.
#
# Not on push: develop takes direct merges by design, and the local gates
# (make test-db, make test-web, the devtools container) stay the primary signal
# for work in progress. A dispatch still works for checking a branch by hand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. No job here publishes anything, so nothing may inherit a write scope —
# including a job added later. Every third-party action below is pinned to a full
# commit sha (the trailing comment is the version that sha was); a tag is mutable and
# these run with the workflow's token.
permissions:
  contents: read

jobs:
  go:
    name: control-plane (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quasar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # TestOpenAPIDrift and TestMetricsManifestDrift read protocol/openapi.yaml,
        # which is a submodule. Without this they fail on a missing file, not on drift.
        with:
          submodules: true
      # go-version (not go-version-file): pin the same Go the project builds
      # with, explicitly — a mismatched gofmt formats differently and produces
      # false gofmt-drift failures. Must stay >= go.mod's `go` directive
      # (currently 1.26.0): setup-go v7 runs with GOTOOLCHAIN=local, so an
      # older pin no longer silently auto-downloads the newer toolchain — it
      # fails the build outright.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: control-plane/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./migrations 2>/dev/null || true)"
          if [ -n "$out" ]; then
            echo "gofmt drift in:" && echo "$out" && exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # -p 1 is mandatory: the DB integration tests share one database and
      # truncate in setup, so package binaries must not run concurrently
      # (see CLAUDE.md "Build / test").
      - name: Test (with Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/quasar?sslmode=disable
        run: go test -p 1 ./...

  web:
    name: web (typecheck + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm, not pnpm: pnpm >= 11 silently skips esbuild's postinstall
      # (ERR_PNPM_IGNORED_BUILDS) and the build fails — see CLAUDE.md.
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- run

  # site/ generates the operator-facing install artifacts: the quick-start
  # compose file, .env and one-paste script. Its tests are the only thing
  # standing between a template edit and an installer that writes a broken
  # stack, and they ran nowhere on a pull request until #148 — pages.yml is
  # manually dispatched, so a regression could reach main unnoticed.
  site:
    name: site (install artifacts + docs build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      # The stack-template contract tests: the one-service seed stack, digest
      # pins, no generated secrets, and every generated script parsing and
      # refusing a leftover Compose stack.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: node-agent (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gstreamer-rs 0.23 sys crates need the GStreamer 1.24 dev headers;
      # ubuntu-24.04 (ubuntu-latest) ships gst 1.24. webrtc/sdp live in -bad.
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          # Dev headers for the sys crates, PLUS the runtime plugin packages —
          # gst-backed tests construct real elements (webrtcbin lives in
          # gstreamer1.0-plugins-bad, not in any -dev package).
          # libasound2-dev supplies alsa.pc: without it the `alsa` crate's
          # alsa-sys build script panics, and cargo reports it as a failed
          # Clippy step rather than a lint.
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-nice \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev
      # This action picks the toolchain from the REF NAME it was used at, so pinning to a
      # sha means `toolchain:` has to be passed explicitly or nothing selects one.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: node-agent
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The virtual input devices against the runner's real kernel uinput: an
      # ioctl the kernel rejects (the #348 UI_SET_PHYS request number) passes
      # every unit test and fails every session launch. Root is needed for
      # /dev/uinput, the fake-udev mknod and /run/udev/data;
      # QUASAR_REQUIRE_UINPUT turns a missing module into a failure, not a skip.
      - name: Load uinput
        run: sudo modprobe uinput && ls -l /dev/uinput
      - name: Test against the real uinput
        run: sudo -E env "PATH=$PATH" QUASAR_REQUIRE_UINPUT=1 cargo test --lib uinput_ -- --ignored --test-threads=1

  # RH-07 #408: the runtime's behavioural suite against each engine mode a hosted runner
  # can host. One job per mode; the assertions are the same for all of them. What a
  # hosted runner cannot give (a GPU, DRM nodes, a uinput group rule) is declared, so
  # those cases report SKIP with the reason; the lab runs them (docs/testing-engine-suite.md).
  engines:
    name: engine suite (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [docker-rootful, docker-rootless, podman-rootful, podman-rootless]
        # Findings Podman fails on, recorded rather than hidden: each still runs, reports
        # KNOWN, and fails the job once it passes so the entry is dropped. restart is 4.9's
        # alone (no restart-policy update); the other two reproduce the lab's Podman 5.
        include:
          - target: podman-rootful
            known: >-
              podman-rootful:restart=Podman 4.9 - the compat container update refuses a restart policy (Engine);
              podman-rootful:stop-crash-loop=a crash-looping unless-stopped service restarts after a stop on Podman (finding from #408);
              podman-rootful:missing-bind-source=Podman creates a missing bind source and starts the container (finding from #408)
          - target: podman-rootless
            known: >-
              podman-rootless:restart=Podman 4.9 - the compat container update refuses a restart policy (Engine);
              podman-rootless:stop-crash-loop=a crash-looping unless-stopped service restarts after a stop on Podman (finding from #408);
              podman-rootless:missing-bind-source=Podman creates a missing bind source and starts the container (finding from #408)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The suite links the agent crate, which needs the same headers as the rust job.
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: node-agent
          shared-key: engine-suite
      - name: Build the suite
        working-directory: node-agent
        run: |
          cargo test -p quasar-node-agent --test engine_suite --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "engine_suite") | .executable // empty' \
            > "$RUNNER_TEMP/engine-suite-path"
          test -s "$RUNNER_TEMP/engine-suite-path"
      - name: Start ${{ matrix.target }}
        run: bash scripts/verify/ci-engine-target.sh "${{ matrix.target }}"
      - name: Run the suite
        env:
          QUASAR_ENGINE_SUITE_KNOWN: ${{ matrix.known }}
          QUASAR_ENGINE_SUITE_LACKS: >-
            cdi=a hosted runner has no NVIDIA GPU;
            dri=a hosted runner has no DRM node;
            uinput=a hosted runner loads no uinput and has no host-preparation group rule for it
        run: |
          suite="$(cat "$RUNNER_TEMP/engine-suite-path")"
          if [ "${ENGINE_SUITE_AS_ROOT:-}" = 1 ]; then
            sudo --preserve-env=QUASAR_ENGINE_SUITE_TARGETS,QUASAR_ENGINE_SUITE_LACKS,QUASAR_ENGINE_SUITE_KNOWN "$suite"
          else
            "$suite"
          fi
