name: CI

# Runs on every pull request. The 2026-07-06 manual-only directive was a COST
# decision: automatic triggers exhausted a private account's Actions minutes.
# Public repositories get them free, and the tradeoff inverted on 2026-08-31 —
# an open repo where nobody can tell whether an incoming change compiles is the
# worse failure. These three jobs are the required checks for a merge to main.
#
# Not on push: develop takes direct merges by design, and the local gates
# (make test-db, make test-web, the devtools container) stay the primary signal
# for work in progress. A dispatch still works for checking a branch by hand.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. No job here publishes anything, so nothing may inherit a write scope —
# including a job added later. Every third-party action below is pinned to a full
# commit sha (the trailing comment is the version that sha was); a tag is mutable and
# these run with the workflow's token.
permissions:
  contents: read

jobs:
  go:
    name: control-plane (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quasar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # TestOpenAPIDrift and TestMetricsManifestDrift read protocol/openapi.yaml,
        # which is a submodule. Without this they fail on a missing file, not on drift.
        with:
          submodules: true
      # go-version (not go-version-file): setup-go reads go.mod's `go 1.23.0`
      # directive and ignores the `toolchain go1.24.x` line — and gofmt 1.23
      # formats differently from the 1.24 the project builds with (dev.sh uses
      # golang:1.24), producing false gofmt-drift failures.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: control-plane/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./migrations 2>/dev/null || true)"
          if [ -n "$out" ]; then
            echo "gofmt drift in:" && echo "$out" && exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # -p 1 is mandatory: the DB integration tests share one database and
      # truncate in setup, so package binaries must not run concurrently
      # (see CLAUDE.md "Build / test").
      - name: Test (with Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/quasar?sslmode=disable
        run: go test -p 1 ./...

  web:
    name: web (typecheck + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm, not pnpm: pnpm >= 11 silently skips esbuild's postinstall
      # (ERR_PNPM_IGNORED_BUILDS) and the build fails — see CLAUDE.md.
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- run

  rust:
    name: node-agent (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # gstreamer-rs 0.23 sys crates need the GStreamer 1.24 dev headers;
      # ubuntu-24.04 (ubuntu-latest) ships gst 1.24. webrtc/sdp live in -bad.
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          # Dev headers for the sys crates, PLUS the runtime plugin packages —
          # gst-backed tests construct real elements (webrtcbin lives in
          # gstreamer1.0-plugins-bad, not in any -dev package).
          # libasound2-dev supplies alsa.pc: without it the `alsa` crate's
          # alsa-sys build script panics, and cargo reports it as a failed
          # Clippy step rather than a lint.
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-nice \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev
      # This action picks the toolchain from the REF NAME it was used at, so pinning to a
      # sha means `toolchain:` has to be passed explicitly or nothing selects one.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: node-agent
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
