name: leak-scan

# THE ONE EXCEPTION TO THE MANUAL-ONLY CI RULE.
#
# Every other workflow in this repo is `workflow_dispatch` only (operator
# directive 2026-07-06: automatic triggers exhausted the account's Actions
# minutes). This one runs automatically, on purpose, for two reasons:
#
#   1. COST. It is a checkout plus one `git grep` — seconds on the smallest
#      runner, no toolchain, no services, no cache. The minutes it spends are
#      negligible against the ones the manual-only rule was protecting.
#   2. IT CANNOT WORK MANUALLY. This repository is mirrored to a public repo,
#      so a committed LAN address, ssh key name or personal domain is
#      published and permanently archived the moment it lands. A guard that
#      only runs when somebody remembers to press a button guards nothing —
#      the whole failure mode is forgetting. Manual-only is right for
#      expensive gates that catch broken code; this is a cheap gate that
#      catches irreversible disclosure.
#
# Do not add triggers to the other workflows on the strength of this one.

on:
  push:
  pull_request:
  workflow_dispatch:
  # The tracker is the other public surface, and it changes without a push — an
  # issue filed from another repo's agent never touches this one. So the issue
  # scan runs on a schedule instead. Same justification as the push trigger
  # above: one API call and a grep, against a disclosure that is irreversible.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: leak-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  scan:
    name: operator fingerprints
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth 0: the scan reads tracked content through `git grep`, which
      # needs a real repository rather than an export.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The operator's own patterns are not committed (a public file listing them
      # publishes what they guard); they come from this repository secret. It is
      # REQUIRED on every event that can see secrets, so a missing or broken secret
      # fails the run instead of passing a generic-only scan. A pull_request from a
      # fork gets no secrets and runs the generic shapes; the push that lands it
      # runs everything.
      - name: Scan tracked content
        env:
          LEAK_SCAN_OPERATOR_PATTERNS: ${{ secrets.LEAK_SCAN_OPERATOR_PATTERNS }}
          LEAK_SCAN_REQUIRE_OPERATOR_PATTERNS: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: bash scripts/dev/leak-scan.sh

      # Never on a pull_request: a fork PR's token cannot read issues, and a
      # scheduled/push run on the repo itself already covers the tracker.
      - name: Scan the issue tracker
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEAK_SCAN_OPERATOR_PATTERNS: ${{ secrets.LEAK_SCAN_OPERATOR_PATTERNS }}
          LEAK_SCAN_REQUIRE_OPERATOR_PATTERNS: '1'
        run: bash scripts/dev/leak-scan.sh --issues

  # CREDENTIALS — the scanner the issue asked for (#595). leak-scan.sh refuses
  # operator fingerprints; it does not look for keys, tokens or passwords at all.
  # This job runs gitleaks over a pull request so a credential-shaped string fails
  # before merge.
  #
  # NO REPOSITORY SECRET. The official gitleaks GitHub action asks for a
  # GITLEAKS_LICENSE on org accounts. Running the pinned gitleaks container directly
  # needs none, so a pull request from a fork scans with no secret — the whole point
  # of the issue. The image is pinned by version AND digest, the same way the
  # WebGPU job pins the Playwright image above.
  #
  # ONLY THE PR'S COMMITS. In pull_request mode gitleaks scans the range
  # merge-base..HEAD, so the fixtures and fingerprints already in history can never
  # block a pull request; a push / dispatch / scheduled run scans the whole tree
  # instead (the fixtures are allow-listed in .gitleaks.toml, and a real secret
  # anywhere in the tree is what that run exists to catch). .gitleaks.toml is read
  # from /repo automatically.
  credentials:
    name: credential scanner (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan for credentials
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
            echo "credentials: scanning pull-request commits ${base}..HEAD"
            scan=(git --log-opts "${base}..HEAD")
          else
            echo "credentials: scanning the full tree (push / dispatch / schedule)"
            scan=(dir)
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}":/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            --timeout 600 "${scan[@]}" /repo --no-banner --redact
