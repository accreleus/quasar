name: pages

# Manual only, like every workflow here except leak-scan (operator directive
# 2026-07-06). Push-to-main is the natural trigger for a docs site and Actions
# minutes are free on a public repo, so this is worth revisiting; until then
# publishing the site is an explicit act, which matches "main is production".
#
# The published base is https://accreleus.github.io/quasar/ and it is not free
# to change: the product UI ships that URL to operators
# (web/src/pages/admin/fleet/EnrollHostModal.tsx). site/astro.config.mjs holds
# the matching `site` + `base`.

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The API reference is generated from protocol/openapi.yaml, so the build
      # fails without the submodule.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      # Sets the Pages origin the artifact is expected to serve from; it does
      # not override astro.config.mjs.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
