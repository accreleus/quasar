name: Agent live tests

# The node-agent suite inside the image the repo builds for it (#571).
#
# ci.yml's node-agent job compiles against the distribution's GStreamer, which has
# no gst-interpipe, so every test behind `live_webrtc_available` returns early there
# and counts as passed: the takeover suite and the #564 leak test with it. Here they
# run, and QUASAR_REQUIRE_LIVE_WEBRTC turns one that cannot into a failure.
#
# The image is pulled, never built. It is quasar-gst-toolchain:<hash>: the patched
# GStreamer, gst-interpipe and the compositor that every agent image is built from,
# published by the Images workflow under deploy/toolchain-hash.sh. A pull request
# that changes a pin, a patch or the toolchain stage has a hash nothing has
# published yet, and this job fails on it and says so: dispatch Images on the branch
# (its toolchain job publishes the tag), then re-run. Building it here would cost
# ~40 minutes on every push and publish nothing, because this workflow holds no
# write scope and must not gain one. A rebuilt base image moves the hash the same
# way, for every branch, until Images has run on develop.
#
# Not a required check: it is path-filtered, and a pull request that matches no
# path never reports it.
#
# The nightly run is develop's. A schedule only fires from the default branch's copy
# of this file, so that run checks develop out by name.
on:
  # Into develop only: the develop -> main release pull request has the push run below.
  pull_request:
    branches: [develop]
    paths:
      - 'node-agent/**'
      - 'deploy/Dockerfile.vulkan'
      - 'deploy/patches/**'
      - 'deploy/pins.env'
      - 'deploy/toolchain-hash.sh'
      - '.github/workflows/agent-live.yml'
      - '.github/workflows/images.yml'
  # A landing on develop runs it too: those runs save the cargo cache every pull request
  # restores (#919). A schedule runs main's copy of this file, so it cannot be that source.
  push:
    branches: [develop]
    paths:
      - 'node-agent/**'
      - 'deploy/Dockerfile.vulkan'
      - 'deploy/patches/**'
      - 'deploy/pins.env'
      - 'deploy/toolchain-hash.sh'
      - '.github/workflows/agent-live.yml'
      - '.github/workflows/images.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: agent-live-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and no registry login: the toolchain and base packages are public.
permissions:
  contents: read

jobs:
  live:
    name: node-agent (live WebRTC tests, toolchain image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          # The test step mounts this checkout into a container that runs the pull
          # request's code, so the token must not be left in it.
          persist-credentials: false
      - name: Pull the toolchain image for these pins
        id: image
        run: |
          set -euo pipefail
          # The Images workflow's derivation: the base's digest is part of the hash.
          base="$(grep -E '^QUASAR_BASE_IMAGE=' deploy/pins.env | head -1 | cut -d= -f2-)"
          if ! QUASAR_BASE_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$base")"; then
            echo "::error::Could not read the base image $base from the registry (the error is on the line above), so the toolchain tag cannot be worked out. This is not a missing toolchain image: re-run the job if the registry was unreachable."
            exit 1
          fi
          export QUASAR_BASE_DIGEST
          bash deploy/toolchain-hash.sh --explain
          image="ghcr.io/$GITHUB_REPOSITORY/quasar-gst-toolchain:$(bash deploy/toolchain-hash.sh)"
          if ! said="$(docker manifest inspect "$image" 2>&1 >/dev/null)"; then
            echo "::error::No published toolchain image for these pins: $image (the registry said: ${said//$'\n'/ }). A pin, a patch, the toolchain stage or the base image changed. Run the Images workflow on this branch (its toolchain job builds and publishes that tag), then re-run this job."
            exit 1
          fi
          docker pull --quiet "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: The image carries the pinned GStreamer
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          want="$(grep -E '^GST_VERSION=' deploy/pins.env | head -1 | cut -d= -f2-)"
          # What cargo links against, then what the loader resolves at run time.
          links="$(docker run --rm "$IMAGE" pkg-config --modversion gstreamer-1.0)"
          loads="$(docker run --rm "$IMAGE" gst-inspect-1.0 --version | sed -n 's/^GStreamer //p')"
          echo "deploy/pins.env pins GStreamer $want; the image links $links and loads $loads"
          if [ "$links" != "$want" ] || [ "$loads" != "$want" ]; then
            echo "::error::$IMAGE is not the GStreamer deploy/pins.env pins (GST_VERSION=$want): it links $links and loads $loads."
            exit 1
          fi
      # The cargo registry and target dir, so a run compiles only what changed instead of
      # all ~250 crates (2.5 min, #919). Keyed on the toolchain image (its rustc and
      # GStreamer) and the lockfile; a lockfile change restores the newest build for the
      # same image. Only a push to develop saves: a pull request's save is visible to that
      # pull request alone.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo
        with:
          path: |
            ${{ runner.temp }}/cargo-registry
            node-agent/target
          key: agent-live-${{ steps.image.outputs.ref }}-${{ hashFiles('node-agent/Cargo.lock') }}
          restore-keys: agent-live-${{ steps.image.outputs.ref }}-
      # line-tables-only debug info keeps file:line in a test's backtrace at about a third
      # of the target dir's size, which is what keeps this cache small enough to keep.
      - name: Test
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-registry"
          docker run --rm --ulimit core=0 -v "$PWD":/workspace -w /workspace/node-agent \
            -v "$RUNNER_TEMP/cargo-registry":/opt/cargo/registry \
            -e CARGO_INCREMENTAL=0 -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            -e QUASAR_REQUIRE_LIVE_WEBRTC=1 -e XDG_RUNTIME_DIR=/tmp "$IMAGE" cargo test --workspace
      - name: Cache size
        if: always()
        run: du -sh "$RUNNER_TEMP/cargo-registry" node-agent/target 2>/dev/null || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.cargo.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/cargo-registry
            node-agent/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
