name: Discord releases
on:
  release:
    types: [published]
  schedule:
    # Releases made with GITHUB_TOKEN do not trigger release workflows.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: discord-release-announcements
  cancel-in-progress: false
jobs:
  announce:
    if: github.repository == 'accreleus/quasar' && vars.DISCORD_RELEASES_ENABLED_AFTER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute scripts from the release tag.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Post future published releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASES_ENABLED_AFTER: ${{ vars.DISCORD_RELEASES_ENABLED_AFTER }}
        run: |
          python3 scripts/release/discord_releases.py --check-config
          python3 scripts/release/discord_releases.py
