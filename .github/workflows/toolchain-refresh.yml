name: Toolchain refresh

# Publishes quasar-gst-toolchain:<hash> when its tag is missing, and nothing else (#1092).
#
# The tag hashes the base image's digest (deploy/toolchain-hash.sh), and the Images workflow
# publishes the toolchain only on a push to develop. So when quasar-base:latest is rebuilt in
# quasar-images, no image exists under the new tag until the next landing, and the nightly live
# job (agent-live.yml) fails until then (#1088: six red nights). This runs ahead of that job
# and closes the gap.
#
# WHAT IT CANNOT DO, by construction: it has no promote or preview job, no registry write
# beyond the toolchain tag and its build cache (`quasar-gst-toolchain-cache:buildcache`),
# and no agent or app image. The preview tag still moves only on a
# push to develop (images.yml).
#
# A SCHEDULE RUNS THE DEFAULT BRANCH'S COPY OF THIS FILE (main), at main's commit, which is
# not develop. So the workflow only fires once it is on main, and every job checks out
# `develop` by name: the pins, patches and Dockerfile it hashes and builds are develop's, the
# same ones agent-live's nightly checks out. A manual dispatch does the same, whatever ref it
# is started on. So the YAML here is main's and the scripts it calls (scripts/release/
# toolchain-missing.sh, toolchain-tag-check.sh) are develop's: keep their output keys
# (`image`, `base_ref`, `build`) and arguments stable, or the two drift apart.
#
# ONE COMMIT: `check` records the develop commit it hashed and `build` checks out that
# commit, then recomputes the tag and fails if it differs. The tag is content-addressed and
# never rebuilt, so a develop landing between the two jobs must not put the new tree's
# image under the old tag.
#
# "Build only when missing": scripts/release/toolchain-missing.sh. A registry that cannot be
# read fails the run; it never reads as "missing, so build" (a 40-minute cost).
on:
  schedule:
    - cron: '17 1 * * *'   # three hours ahead of agent-live's 04:23, for a cold build
  workflow_dispatch:

# Never cancelled: a half-done 40-minute build helps no one. A second run waits and then finds the tag.
concurrency:
  group: toolchain-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_NS: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: is the toolchain for develop's pins published?
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.missing.outputs.build }}
      image: ${{ steps.missing.outputs.image }}
      base_ref: ${{ steps.missing.outputs.base_ref }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: develop
          persist-credentials: false
      # No registry login: the base and toolchain packages are public, as in agent-live.
      - name: Work out the tag and whether it is published
        id: missing
        run: |
          set -euo pipefail
          out="$(bash scripts/release/toolchain-missing.sh)"
          tee -a "$GITHUB_OUTPUT" <<<"$out"
          # Explain the hash that was used: with the base digest, not the mutable tag.
          base_ref="$(sed -n 's/^base_ref=//p' <<<"$out")"
          QUASAR_BASE_DIGEST="${base_ref##*@}" bash deploy/toolchain-hash.sh --explain

  build:
    name: build and publish the toolchain
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: The checkout still hashes to the tag `check` decided on
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          BASE_REF: ${{ needs.check.outputs.base_ref }}
        run: bash scripts/release/toolchain-tag-check.sh "$IMAGE" "$BASE_REF"
      # Hours can pass between `check` and here, and an Images run on develop may have published
      # this tag meanwhile. A second build would overwrite it with a different digest (BUILT_AT
      # differs), so look again and stand down if it exists. An unreadable registry fails.
      - name: Is the tag still missing?
        id: recheck
        run: |
          set -euo pipefail
          out="$(bash scripts/release/toolchain-missing.sh)"
          echo "$out"
          if grep -qx 'build=false' <<<"$out"; then
            echo "The toolchain tag was published while this run waited; nothing to build."
          fi
          grep -x 'build=.*' <<<"$out" >> "$GITHUB_OUTPUT"
      - name: Stamp the build time
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Free runner disk space
        if: steps.recheck.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.recheck.outputs.build == 'true'
      - name: Log in to GHCR
        if: steps.recheck.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Keep in step with images.yml's toolchain job: same target, same build args, same cache.
      - name: Build and publish the toolchain
        if: steps.recheck.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.vulkan
          target: toolchain
          push: true
          tags: ${{ needs.check.outputs.image }}
          provenance: false
          sbom: false
          build-args: |
            QUASAR_BASE_IMAGE=${{ needs.check.outputs.base_ref }}
            SOURCE_COMMIT=${{ steps.checkout.outputs.commit }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=registry,ref=${{ env.REGISTRY_NS }}/quasar-gst-toolchain-cache:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_NS }}/quasar-gst-toolchain-cache:buildcache,mode=max
