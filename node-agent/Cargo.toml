[package]
name = "quasar-node-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# P1-5: graduated session pipeline (compositor -> encode -> webrtcbin) +
# WebRTC negotiation / SDP marshalling.
#
# The gstreamer-rs family — every `gstreamer*` crate PLUS `glib` and the `-sys`
# crates they pull — moves as ONE generation. Two glib generations linked into one
# binary is never acceptable: the subclass traits (`ObjectSubclass`, `ElementImpl`,
# `RTPHeaderExtensionImpl`) are per-crate-version, so a `glib 0.20` subclass impl
# does not satisfy a `gstreamer-rtp 0.25` bound and the build fails with an E0277
# cascade that reads like a macro change. `.github/dependabot.yml` groups them for
# the same reason; if a bump ever splits them, bump the stragglers by hand.
# gstreamer-rs 0.25 <-> glib 0.22, MSRV 1.92.
#
# GStreamer floor: gstreamer-sys 0.25 requires gstreamer-1.0 >= 1.14 by default and
# >= 1.20 with the `v1_20` feature enabled below. The vendored runtime is pinned at
# 1.28.4 (docs/third-party-pins.md) and CI runs against 1.24, so do NOT enable a
# `v1_26`/`v1_28`/`v1_30` feature here — it would raise the floor above CI's gst.
#
# Cargo.lock PIN: `kstring` is held at 2.0.2. gstreamer 0.25 depends on it (^2.0) and
# kstring 2.0.3+ raises its MSRV to rustc 1.96, above the toolchain the image lineage
# pins (deploy/Dockerfile.vulkan `ARG RUST_VERSION=1.94.0`), so an unpinned resolve
# builds fine on CI's `stable` and then fails the agent image build with
# "rustc 1.94.0 is not supported by the following package: kstring@2.0.4".
# Re-pin with `cargo update -p kstring --precise 2.0.2` after any lockfile churn,
# or lift the pin once RUST_VERSION reaches 1.96.
gstreamer = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-sdp = "0.25"
# g2g: RTPBuffer writable access for the abs-capture-time one-byte-header extension.
gstreamer-rtp = { version = "0.25", features = ["v1_20"] }
# Adaptive external resolution: the typed upstream force-key-unit event used to make
# the encoder emit an IDR (with headers) right after a live resolution change.
gstreamer-video = "0.25"
glib = "0.22"

# P1-5 (container launch): virtual evdev input devices (uinput) so a
# containerized game — and the gamepad, which Wayland has no protocol for — sees
# real /dev/input devices. `libc` is for the fake-udev `mknod` of the device node.
input-linux = "0.7"
libc = "0.2"
# Wave 3.2: typed DRM card/connector/mode enumeration. This uses kernel DRM
# ioctls rather than flattening lossy connector names from sysfs.
drm = "0.15"

# #175: agent-pull backing-store reaping. A small blocking HTTP client for the
# two control-plane GC endpoints (GET gc-pending / POST gc-confirm). The reap
# pass runs on a spawned blocking thread (like the startup orphan sweep), so a
# blocking client is the natural fit and avoids pulling a full async HTTP stack.
# Image-management P4 also reuses it to download the template build-context tarball.
ureq = { version = "3.4", features = ["json"] }

# Image-management P4 (template builds): extract the GitHub codeload `.tar.gz`
# build-context tarball. Small, pure-Rust crates; the extraction runs on the
# build worker's std::thread. `flate2` defaults to the pure-Rust miniz_oxide
# backend (no C toolchain needed).
tar = "0.4"
flate2 = "1"

# session_capture: bounded observation payloads travel gzipped + base64'd on the
# reliable trace lane. `flate2` above is reused; base64 is already in the lock as a
# transitive dep, so this makes an existing crate a direct one rather than adding a
# new build input.
base64 = "0.23"

# First-run S1 (NVIDIA driver-volume provisioning): the `.run` installer has no
# signature to verify, so the sha256 of exactly what was fetched is recorded in
# the volume's manifest. Pure Rust, no C toolchain.
sha2 = "0.11"

# Console-mode local audio: enable the `IEC958 Playback Switch` ALSA mixer
# control before starting the local-audio pipeline. HDA codec state (incl.
# this switch) resets on reboot/module reload and the host has no
# alsactl-restore, so the agent must flip it on itself every session start
# (see `session::audio::enable_iec958_playback_switches`). Uses alsa-lib,
# already a runtime dependency of `alsasink`/`pulsesrc`.
alsa = "0.12"

[features]
# ZC-02 N-A (full zero-copy NVENC): FFI-links libgstcuda-1.0 to create one GstCudaContext
# and share it across the source + encode pipelines so the compositor's memory:CUDAMemory
# surfaces are valid across the interpipe. OFF by default — the AMD/hermes image has no
# libgstcuda, so its build is unaffected; the quasar-nv image builds `--features cuda`
# (mirroring how gst-wayland-display itself is built `--features cuda` only there).
cuda = []

[build-dependencies]
# Probe gstreamer-cuda-1.0 to link libgstcuda when the `cuda` feature is on.
pkg-config = "0.3"

[dev-dependencies]
# SO-03: micro-benchmark the per-frame encode-metrics hot path (record_encode_in/out).
criterion = "0.8"
# P5-03: temporary directories for home module unit tests.
tempfile = "3"
# #530: `#[tokio::test(start_paused = true)]` needs the `test-util` feature (not
# part of `full`) — used by the select!-arm-disable regression tests in agent.rs.
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "encode_metrics"
harness = false

# #149: the production agent runs the release binary (deploy/docker-compose.yml).
# Debug Rust is 3-10x slower on the hot media/metrics paths and ~5x larger.
# Dev/test loops (dev.sh build/test, acceptance scripts) stay on debug builds.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# PROF-02 (#389): the profile every Rust capture in the profiling campaign is taken
# against. It INHERITS release, so the optimisation shape being measured is the shape
# that ships — measuring a debug build would be measuring a different program.
#
# What `[profile.release]` above lacks is any `debug` key, so `debug = false` and the
# binary carries no DWARF. Symbols survive (`strip` is unset), so `perf` and `samply`
# resolve function NAMES off the release binary already. What they cannot do is give
# line numbers, and — the part that actually misleads — inlined frames are attributed
# to whatever they were inlined INTO. With `codegen-units = 1` plus thin LTO the
# inlining is aggressive, so a flamegraph off the release binary is confidently wrong
# about where time goes.
#
# `debug = 1` emits line tables only. It changes NO codegen: same opt-level, same LTO,
# same codegen-units, so the measurement is still of the shipped shape — it only adds
# the debug info needed to attribute a sample.
#
# DELIBERATELY NOT APPLIED TO `[profile.release]`. Line tables inflate the binary and
# therefore the image, and deploy/image-contract.json asserts image properties. Per
# CLAUDE.md the contract is never relaxed to make a build green, so the profiling
# build is a separate, non-promoted image variant
# (`deploy/build-images.sh profiling`, Dockerfile.vulkan --target profiling).
#
# Build it with frame pointers for reliable unwinding:
#   RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
# Capture recipe: docs/profiling-rust.md.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
