[package]
name = "gst-plugin-pyrowave"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "pyrowaveenc: PyroWave intra-only wavelet encoder (Vulkan compute) as a GStreamer element"

# The cdylib is the GStreamer plugin the image installs (gst-launch, the registry);
# the rlib gives the agent the reference decoder for its PyroWave codec probe.
# libpyrowave-shared is dlopened, never linked: CI and the devtools image build and
# test without it.
[lib]
name = "gstpyrowave"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Written exactly as the agent writes them, so the one Cargo.lock resolves both.
[dependencies]
gstreamer = "0.25"
gstreamer-video = "0.25"
glib = "0.22"
libc = "0.2"
# Render node -> Vulkan deviceUUID (VK_EXT_physical_device_drm), instance-level only.
ash = "0.38"

[dev-dependencies]
gstreamer-app = "0.25"
serde_json = "1"
