[package]
name = "quasar-recovery"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The Quasar recovery actor's library: the ported release trust gates and the control socket's wire shapes"

# Like quasar-runtime, this crate must never depend on gstreamer*, glib or anything
# CUDA: the recovery actor is a small static binary in a slim image
# (tests/gstreamer_free_convention.rs walks the lockfile closure).
#
# Every requirement is written exactly as the agent (or bollard, for the hyper family)
# already enables it, so the single workspace Cargo.lock resolves them to the versions
# and features it already carries and adds no package.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Ed25519 verification, and the TLS provider below.
ring = "0.17"
tracing = "0.1"
base64 = "0.23"
# The release-asset fetch (trust::https). ring, never aws-lc-rs; webpki roots, never
# the OS store, as the agent's control-plane link.
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# Go's transport requests and transparently decodes gzip.
flate2 = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
