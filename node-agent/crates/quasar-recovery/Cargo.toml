[package]
name = "quasar-recovery"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The Quasar recovery actor's library: the ported release trust gates and the control socket's wire shapes"

# Like quasar-runtime, this crate must never depend on gstreamer*, glib or anything
# CUDA: the recovery actor is a small static binary in a slim image
# (tests/gstreamer_free_convention.rs walks the lockfile closure).
#
# Every requirement is written exactly as the agent already writes it, so the single
# workspace Cargo.lock resolves them to the versions it already carries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Ed25519 verification. Already in the lock through rustls' ring provider.
ring = "0.17"
tracing = "0.1"

[dev-dependencies]
base64 = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
