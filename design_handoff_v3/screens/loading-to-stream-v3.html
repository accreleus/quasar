<!doctype html>
<html lang="en" data-design-system="quasar-v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b12">
<title>Quasar | Loading to stream · V3</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap");

/* Quasar V2 reference token contract — source: quasar-component-library.html */
:root{color-scheme:dark;
--bg:oklch(0.1449 0.0115 266.85);--surface:oklch(0.1869 0.0151 266.77);--surface-raised:oklch(0.224 0.018 263);--surface-active:oklch(0.272 0.022 260);
--fg:oklch(0.9618 0.0086 247.91);--fg-strong:oklch(0.985 0.004 247);--muted:oklch(0.6605 0.0265 259.81);--muted-strong:oklch(0.76 0.022 258);
--border:oklch(0.6605 0.0265 259.81/0.28);--border-strong:oklch(0.6605 0.0265 259.81/0.46);
--accent:oklch(0.5998 0.2179 273.21);--accent-soft:oklch(0.5998 0.2179 273.21/0.16);
--action:oklch(0.5 0.19 273.21);--action-hover:oklch(0.54 0.19 273.21);--action-pressed:oklch(0.46 0.19 273.21);--core:oklch(0.105 0.01 267);
--success:oklch(0.76 0.15 164);--success-soft:oklch(0.76 0.15 164/0.12);--warning:oklch(0.82 0.14 85);--danger:oklch(0.69 0.19 27);
--glass:oklch(0.1869 0.0151 266.77/0.46);--glass-strong:oklch(0.224 0.018 263/0.62);--glass-control:oklch(0.272 0.022 260/0.66);
--glass-border:oklch(0.9618 0.0086 247.91/0.12);--glass-highlight:oklch(0.9618 0.0086 247.91/0.14);
--display:"Michroma","Eurostile Extended",Microgramma,ui-sans-serif,sans-serif;
--body:"IBM Plex Sans",Inter,ui-sans-serif,system-ui,sans-serif;
--mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
--control-h:2.75rem;--space-panel:clamp(1rem,2vw,1.5rem);
--r-control:0.25rem;--r-panel:0.5rem;--r-feature:0.75rem;
--panel-shadow:inset 0 1px 0 var(--glass-highlight),0 14px 36px -32px oklch(0.05 0.01 267/0.68);
--glass-shadow:inset 0 1px 0 var(--glass-highlight),0 22px 58px -32px oklch(0.05 0.01 267/0.82);}

*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:0.94rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent)}a:hover{color:var(--fg)}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- shared system primitives (library: eyebrow / chip / panel / telemetry / button) ---- */
.wordmark{font-family:var(--display);font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase}
.chip{display:inline-flex;min-height:1.75rem;align-items:center;gap:0.4rem;padding:0 0.65rem;border:1px solid var(--border);border-radius:99rem;
  background:var(--glass-strong);color:var(--muted-strong);font:0.72rem var(--mono);letter-spacing:0.04em;backdrop-filter:blur(14px)}
.chip::before{content:"";width:0.4rem;height:0.4rem;border-radius:50%;background:var(--state,var(--muted))}
.chip.connecting{--state:var(--accent);border-color:oklch(0.5998 0.2179 273.21/0.35)}
.chip.ready{--state:var(--success);border-color:oklch(0.76 0.15 164/0.3);color:var(--fg)}
.chip.ready::before,.chip.connecting::before{animation:pulse 1.6s ease-in-out infinite}
.panel{border:1px solid var(--glass-border);border-radius:var(--r-panel);background:var(--glass);box-shadow:var(--panel-shadow);
  backdrop-filter:blur(24px) saturate(118%);-webkit-backdrop-filter:blur(24px) saturate(118%)}
.telemetry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden;border:1px solid var(--glass-border);
  border-radius:var(--r-panel);background:var(--glass);box-shadow:var(--panel-shadow);backdrop-filter:blur(22px) saturate(114%)}
.telemetry div{padding:0.7rem 0.9rem;border-right:1px solid var(--border)}
.telemetry div:last-child{border-right:0}
.telemetry span{display:block;color:var(--muted);font-size:0.68rem}
.telemetry strong{display:block;margin-top:0.2rem;font:500 0.95rem var(--mono)}
.telemetry em{font-style:normal;color:var(--muted);font-size:0.68rem;margin-left:0.25rem}
.button{display:inline-flex;min-height:var(--control-h);align-items:center;gap:0.5rem;padding:0 1rem;border:1px solid var(--border-strong);
  border-radius:var(--r-control);background:var(--glass-control);color:var(--fg);cursor:pointer;font-weight:600;font-size:0.85rem;
  box-shadow:inset 0 1px 0 oklch(0.9618 0.0086 247.91/0.12),0 1px 2px oklch(0.05 0.01 267/0.38),0 6px 14px -10px oklch(0.05 0.01 267/0.8);
  backdrop-filter:blur(14px) saturate(115%);transition:background 150ms ease,border-color 150ms ease,box-shadow 150ms ease,transform 150ms ease}
.button:hover{border-color:var(--muted-strong);background:oklch(0.315 0.026 260/0.76);transform:translateY(-1px)}
.button:active{box-shadow:inset 0 1px 3px oklch(0.05 0.01 267/0.55);transform:translateY(1px)}
.icon-button{display:grid;width:var(--control-h);min-height:var(--control-h);place-items:center;padding:0;border:1px solid var(--border-strong);
  border-radius:var(--r-control);background:var(--glass-control);color:var(--fg);cursor:pointer;
  box-shadow:inset 0 1px 0 oklch(0.9618 0.0086 247.91/0.12),0 1px 2px oklch(0.05 0.01 267/0.38);backdrop-filter:blur(14px) saturate(115%);
  transition:background 150ms ease,border-color 150ms ease,transform 150ms ease}
.icon-button:hover{border-color:var(--muted-strong);background:oklch(0.315 0.026 260/0.76);transform:translateY(-1px)}
.icon-button svg{width:1.05rem;height:1.05rem}

/* ---- the connected stream underneath (revealed at lock) ---- */
.stream-ui{position:fixed;z-index:0;inset:0;overflow:hidden;background:var(--core)}
.game-world{position:absolute;inset:-4%;overflow:hidden;transform:scale(1.08);
  filter:blur(18px) saturate(.7) brightness(.55);transition:transform 2.2s cubic-bezier(.2,.75,.2,1),filter 1.6s ease;
  background:radial-gradient(circle at 68% 24%,#fff 0 1.1%,oklch(0.9 0.05 273) 1.2% 2.2%,oklch(0.5998 0.2179 273.21/0.32) 3.4%,transparent 11%),
    linear-gradient(174deg,transparent 0 57%,oklch(0.16 0.05 273/0.88) 57.2% 100%),
    radial-gradient(ellipse at 48% 42%,oklch(0.5998 0.2179 273.21/0.34),transparent 30%),
    linear-gradient(oklch(0.14 0.03 266) 0 40%,oklch(0.22 0.07 273) 61%,var(--core) 100%)}
.game-world::before{position:absolute;inset:0;content:"";opacity:.6;
  background:radial-gradient(circle at 14% 16%,#fff 0 .7px,transparent .9px),
    radial-gradient(circle at 77% 11%,oklch(0.86 0.06 273) 0 .8px,transparent 1px),
    radial-gradient(circle at 46% 28%,#fff 0 .6px,transparent .8px);
  background-size:91px 91px,137px 137px,61px 61px}
.planet{position:absolute;top:7%;right:8%;width:min(24vw,290px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 27%,oklch(1 0 0/0.4),transparent 3%),
    radial-gradient(circle at 40% 36%,oklch(0.62 0.03 273),oklch(0.42 0.03 273) 35%,oklch(0.2 0.03 273) 70%);
  box-shadow:inset -35px -20px 60px oklch(0.05 0.01 267/0.82),0 0 45px oklch(0.5998 0.2179 273.21/0.18)}
.planet::after{position:absolute;inset:43% -30%;border:2px solid oklch(0.72 0.12 273/0.34);border-radius:50%;content:"";transform:rotate(-17deg)}
.mountain{position:absolute;bottom:18%;width:48%;height:37%;
  clip-path:polygon(0 100%,0 69%,13% 50%,23% 64%,39% 18%,52% 58%,67% 34%,81% 71%,100% 48%,100% 100%);
  background:linear-gradient(155deg,oklch(0.28 0.05 273),oklch(0.17 0.03 270) 58%,var(--core))}
.mountain::after{position:absolute;inset:0;content:"";clip-path:polygon(32% 100%,39% 18%,44% 62%,52% 58%,59% 100%);
  background:linear-gradient(120deg,oklch(0.72 0.12 273/0.38),transparent 65%)}
.mountain-left{left:-3%}
.mountain-right{right:-4%;transform:scaleX(-1) scale(.83);transform-origin:bottom right;opacity:.75}
.ground{position:absolute;right:0;bottom:0;left:0;height:39%;overflow:hidden;
  background:linear-gradient(90deg,transparent 49.8%,oklch(0.5998 0.2179 273.21/0.22) 50%,transparent 50.2%),
    linear-gradient(oklch(0.5998 0.2179 273.21/0.13) 1px,transparent 1px),
    linear-gradient(90deg,oklch(0.5998 0.2179 273.21/0.1) 1px,transparent 1px),
    linear-gradient(oklch(0.16 0.03 270),var(--core));
  background-size:100% 100%,100% 44px,64px 100%,100% 100%;
  transform:perspective(350px) rotateX(58deg) scale(1.45);transform-origin:center bottom;mask-image:linear-gradient(transparent,black 35%)}
.rider{position:absolute;z-index:2;bottom:19%;left:50%;width:42px;height:86px;transform:translateX(-50%);filter:drop-shadow(0 8px 8px oklch(0.05 0.01 267/0.65))}
.rider::before{position:absolute;top:0;left:9px;width:24px;height:24px;border-radius:48% 48% 40% 40%;content:"";background:oklch(0.12 0.02 267);
  box-shadow:inset 5px 1px 0 oklch(0.5998 0.2179 273.21/0.3)}
.rider::after{position:absolute;top:21px;left:5px;width:32px;height:65px;content:"";
  clip-path:polygon(26% 0,74% 0,100% 100%,50% 82%,0 100%);background:linear-gradient(90deg,oklch(0.11 0.02 267),oklch(0.28 0.04 273) 55%,oklch(0.11 0.02 267))}

.stream-chrome{position:absolute;z-index:5;inset:0;pointer-events:none}
.stream-topbar,.stream-footer,.stream-toast{opacity:0;transform:translateY(-0.75rem);transition:opacity 220ms cubic-bezier(0.2,0,0,1),transform 220ms cubic-bezier(0.2,0,0,1)}
.stream-topbar{position:absolute;top:1.5rem;left:1.75rem;display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0.9rem}
.stream-topbar .mark{width:2rem;height:2rem;flex:none}
.stream-title{font-size:0.85rem;font-weight:600;letter-spacing:-0.01em}
.stream-detail{color:var(--muted);font:0.68rem var(--mono);letter-spacing:0.08em;text-transform:uppercase}
.stream-toast{position:absolute;top:1.6rem;right:1.75rem}
.stream-footer{position:absolute;right:1.75rem;bottom:1.5rem;left:1.75rem;display:flex;align-items:flex-end;justify-content:space-between;
  gap:1rem;transform:translateY(0.75rem)}
.stream-footer .telemetry{width:min(34rem,64vw)}
.stream-actions{display:flex;gap:0.5rem;pointer-events:auto}

/* ---- the loading scene ---- */
.scene{position:fixed;z-index:10;inset:0;display:grid;min-height:32rem;place-items:center;isolation:isolate;
  background:radial-gradient(circle at 50% 44%,var(--accent-soft),transparent 32%),
    radial-gradient(circle at 84% 12%,oklch(0.5998 0.2179 273.21/0.07),transparent 30%),
    linear-gradient(150deg,var(--bg),oklch(0.13 0.012 267) 58%,var(--core));
  transition:opacity 220ms cubic-bezier(0.2,0,0,1)}

.lockup{position:absolute;top:clamp(1.5rem,4vw,2.5rem);left:clamp(1.5rem,4vw,3rem);display:flex;align-items:center;gap:0.85rem}
.lockup .mark{width:2.35rem;height:2.35rem;flex:none}
.scene>.chip{position:absolute;top:clamp(1.6rem,4vw,2.7rem);right:clamp(1.5rem,4vw,3rem);display:none}

/* accretion visual — one accent hue, per the colour rules */
.quasar{position:relative;width:min(58vw,620px);aspect-ratio:1.9;transform:translateY(-6%)}
.jet{position:absolute;top:50%;left:50%;width:70%;height:6px;border-radius:50%;transform-origin:left center;
  background:linear-gradient(90deg,#fff,oklch(0.78 0.16 273) 9%,oklch(0.5998 0.2179 273.21/0.6) 38%,transparent 100%);
  filter:blur(1px);opacity:0;animation:jet-pulse 4.8s cubic-bezier(.6,0,.25,1) infinite}
.jet::after{position:absolute;inset:-24px 0;content:"";background:inherit;filter:blur(18px);opacity:.4}
.jet-right{transform:rotate(-8deg)}
.jet-left{transform:rotate(172deg)}
.orbit{position:absolute;top:50%;left:50%;border:1px solid oklch(0.5998 0.2179 273.21/0.34);border-radius:50%;
  transform:translate(-50%,-50%) rotate(-9deg)}
.orbit-a{width:49%;height:29%;animation:breathe 4.8s ease-in-out infinite}
.orbit-b{width:67%;height:38%;border-color:oklch(0.72 0.12 273/0.16);animation:breathe 4.8s .18s ease-in-out infinite reverse}
.disc{position:absolute;top:50%;left:50%;width:45%;height:19%;border-radius:50%;transform:translate(-50%,-50%) rotate(-8deg);
  background:radial-gradient(ellipse,transparent 0 19%,#fff 20% 21%,oklch(0.82 0.14 273) 23%,var(--accent) 42%,oklch(0.42 0.19 273) 60%,transparent 72%);
  filter:blur(1.5px);animation:disc-spin 4.8s cubic-bezier(.4,0,.2,1) infinite}
.disc::before,.disc::after{position:absolute;inset:13% -8%;border-radius:50%;content:"";
  border-top:2px solid oklch(1 0 0/0.7);border-bottom:1px solid oklch(0.78 0.14 273/0.3);filter:blur(.5px)}
.disc::after{inset:-20% -20%;border-width:1px;opacity:.34}
.core{position:absolute;z-index:2;top:50%;left:50%;width:8.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#fff;
  box-shadow:0 0 7px 2px #fff,0 0 20px 7px oklch(0.78 0.16 273),0 0 52px 17px var(--accent),0 0 100px 30px oklch(0.5998 0.2179 273.21/0.3);
  animation:core-pulse 4.8s ease-in-out infinite}
.scanline{position:absolute;z-index:3;top:50%;left:50%;width:68%;height:1px;transform:translate(-50%,-50%) rotate(-8deg);
  background:linear-gradient(90deg,transparent,var(--accent),#fff,var(--accent),transparent);opacity:0;animation:scan 4.8s ease-out infinite}

/* No backing panel: the scene behind it is empty, so a card only drew a box
   around nothing. The sequence centres on the same axis as the quasar. */
.status{position:absolute;bottom:clamp(2.25rem,7vh,4.5rem);left:50%;width:min(90vw,34rem);
  transform:translateX(-50%);text-align:center}
.status h1{margin:0;color:var(--fg-strong);font-size:clamp(1.5rem,2.6vw,2rem);font-weight:500;line-height:1.15;letter-spacing:-0.03em}
.status h1 .verb{display:block}
/* The phase sits on its own line: as an inline sibling every word swap moved
   the static verb. Its own line means only the phase itself animates. */
.stage{display:block;color:var(--accent);transition:opacity 140ms cubic-bezier(0.2,0,0,1),transform 140ms cubic-bezier(0.2,0,0,1)}
.stage.changing{opacity:0;transform:translateY(0.4rem)}
/* Glyphs are the system sprite verbatim (glyph-network, glyph-stream,
   glyph-gamepad); only the padlock is bespoke, as the sprite has
   no lock. Progress is one rail: a glyph per phase, the live phase animating and
   its connector scanning. No labels — the headline already names the phase, so
   repeating four of them was the card's real clutter. */
.progress-rail{display:flex;align-items:center;gap:0.5rem;width:min(28rem,100%);margin:0 auto;padding:0;list-style:none}
.step{display:grid;place-items:center;width:3.1rem;height:3.1rem;flex:none;border:1px solid transparent;border-radius:50%;
  color:var(--muted);opacity:.38;transition:color 150ms ease,opacity 150ms ease,border-color 150ms ease,background 150ms ease}
.step svg{display:block;width:2rem;height:2rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.step[data-state="active"]{color:var(--accent);opacity:1}
/* Completed phases keep their own glyph and gain a ring — a row of identical
   ticks would erase which phase finished. */
.step[data-state="done"]{color:var(--success);opacity:1;border-color:oklch(0.76 0.15 164/0.45);background:oklch(0.76 0.15 164/0.08)}
.link{position:relative;flex:1 1 auto;min-width:0.75rem;height:1px;overflow:hidden;background:var(--surface-active)}
.link[data-state="done"]{background:oklch(0.76 0.15 164/0.5)}
.link[data-state="active"]::after{position:absolute;inset:0;content:"";background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:link-scan 1.25s ease-in-out infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.step[data-state="active"] .arc{animation:wave 1.5s ease-in-out infinite}
.step[data-state="active"] .arc:nth-child(2){animation-delay:160ms}
.step[data-state="active"] .arc:nth-child(3){animation-delay:320ms}
.step[data-state="active"] .shackle{animation:latch 1.5s ease-in-out infinite}
.step[data-state="active"] .play{transform-origin:12px 12px;animation:beat 1.5s ease-in-out infinite}
.step[data-state="active"] .key{animation:press 1.2s ease-in-out infinite}
.step[data-state="active"] .key-b{animation-delay:300ms}
.status-foot{display:flex;justify-content:center;margin-top:1.6rem}

.aperture{position:fixed;z-index:20;top:50%;left:50%;width:10px;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;
  transform:translate(-50%,-56%) scale(0);background:#fff;box-shadow:0 0 30px 12px oklch(0.82 0.14 273),0 0 100px 35px var(--accent)}

body.is-locking .status{animation:status-lock 400ms cubic-bezier(0.2,0,0,1) forwards}
body.is-locking .quasar{animation:quasar-lock 900ms cubic-bezier(.4,0,.2,1) forwards}
body.is-locking .aperture{animation:aperture 1.65s cubic-bezier(.5,0,.15,1) forwards}
body.is-streaming .scene{opacity:0;pointer-events:none}
body.is-streaming .game-world{transform:scale(1);filter:blur(0) saturate(1) brightness(1)}
body.is-streaming .stream-topbar,body.is-streaming .stream-footer,body.is-streaming .stream-toast{opacity:1;transform:translateY(0);transition-delay:550ms}
body.is-streaming .stream-toast{transition-delay:800ms}

@keyframes pulse{50%{opacity:.35}}
@keyframes core-pulse{0%,100%{transform:translate(-50%,-50%) scale(.78)}28%{transform:translate(-50%,-50%) scale(1.15)}55%{transform:translate(-50%,-50%) scale(.93)}73%{transform:translate(-50%,-50%) scale(1.3)}}
@keyframes disc-spin{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(.55);opacity:.2}24%{transform:translate(-50%,-50%) rotate(5deg) scale(1);opacity:1}68%{transform:translate(-50%,-50%) rotate(-14deg) scale(1.04);opacity:.9}88%,100%{transform:translate(-50%,-50%) rotate(-8deg) scale(.58);opacity:.18}}
@keyframes jet-pulse{0%,14%,100%{opacity:0;width:1%}32%{opacity:.75;width:52%}58%{opacity:.4;width:70%}76%{opacity:1;width:82%}88%{opacity:0;width:94%}}
@keyframes breathe{0%,100%{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(.55)}30%,70%{opacity:1;transform:translate(-50%,-50%) rotate(2deg) scale(1)}88%{opacity:.1;transform:translate(-50%,-50%) rotate(10deg) scale(1.25)}}
@keyframes scan{0%,50%,100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scaleX(.2)}65%{opacity:.15}75%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scaleX(1.2)}82%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scaleX(1.5)}}
@keyframes progress{0%{transform:translateX(-100%)}75%{transform:translateX(-8%)}86%,100%{transform:translateX(100%)}}
@keyframes progress-complete{to{transform:translateX(0)}}
@keyframes link-scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes wave{0%,100%{opacity:.22}50%{opacity:1}}
@keyframes latch{0%,100%{transform:translateY(-0.75px)}55%{transform:translateY(0)}}
@keyframes beat{0%,100%{transform:scale(.84)}50%{transform:scale(1.08)}}
@keyframes press{0%,100%{opacity:.28}50%{opacity:1}}
@keyframes status-lock{0%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(1.25rem) scale(.98);opacity:0}}
@keyframes quasar-lock{0%{transform:translateY(-6%) scale(1)}55%{transform:translateY(-6%) scale(.32);filter:brightness(2.5)}100%{transform:translateY(-6%) scale(.02);filter:brightness(6);opacity:0}}
@keyframes aperture{0%,20%{opacity:0;transform:translate(-50%,-56%) scale(0)}37%{opacity:1;transform:translate(-50%,-56%) scale(2)}62%{opacity:1;transform:translate(-50%,-56%) scale(180)}100%{opacity:0;transform:translate(-50%,-56%) scale(230)}}

@media (max-width:900px){.stream-footer .telemetry{width:auto;flex:1}}
@media (max-width:650px){
  .quasar{width:94vw}
  .scene>.chip{display:none}
  .status{width:calc(100% - 2rem)}
  .progress-rail{width:100%}  .stream-topbar{top:1rem;left:1rem}
  .stream-toast{top:auto;right:1rem;bottom:6rem}
  .stream-footer{right:1rem;bottom:1rem;left:1rem;flex-direction:column;align-items:stretch}
  .telemetry{grid-template-columns:repeat(2,minmax(0,1fr))}
  .telemetry div:nth-child(2){border-right:0}
  .telemetry div:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .planet{width:46vw}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .core{transform:translate(-50%,-50%)}
  .jet{width:60%;opacity:.45}
}
</style>
</head>
<body>
<section class="stream-ui" aria-label="Connected game stream" aria-hidden="true" inert>
  <div class="game-world" aria-hidden="true">
    <div class="planet"></div>
    <div class="mountain mountain-left"></div>
    <div class="mountain mountain-right"></div>
    <div class="ground"></div>
    <div class="rider"></div>
  </div>

  <div class="stream-chrome">
    <div class="stream-topbar panel">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="14.2" ry="5.4" transform="rotate(-30 16 16)" stroke="url(#quasar-gradient)" stroke-width="1.6" opacity=".75"/>
        <circle cx="16" cy="16" r="6.2" fill="url(#quasar-gradient)"/>
        <circle cx="16" cy="16" r="2.1" fill="#fff"/>
      </svg>
      <div>
        <div class="stream-title">Nocturne Drift</div>
        <div class="stream-detail">quasar-node-1 · 1080p60</div>
      </div>
    </div>

    <span class="chip ready stream-toast" role="status">Stream connected</span>

    <div class="stream-footer">
      <div class="telemetry" aria-label="Session telemetry">
        <div><span>Frame rate</span><strong>59.9<em>fps</em></strong></div>
        <div><span>Round trip</span><strong>8<em>ms</em></strong></div>
        <div><span>Bitrate</span><strong>14.2<em>Mb/s</em></strong></div>
        <div><span>Packet loss</span><strong>0.0<em>%</em></strong></div>
      </div>
      <div class="stream-actions">
        <button class="icon-button replay" type="button" aria-label="Replay connection sequence" title="Replay sequence">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.2 5.2A5.5 5.5 0 1 1 2.8 10M3.2 5.2V1.9M3.2 5.2H6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-button" type="button" aria-label="Open session menu" title="Session menu">
          <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<main class="scene" aria-live="polite">
  <header class="lockup">
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="quasar-gradient" x1="2" y1="2" x2="30" y2="30">
          <stop offset="0" stop-color="#6A45F5"/>
          <stop offset=".5" stop-color="#5B6BFF"/>
          <stop offset="1" stop-color="#00C0FF"/>
        </linearGradient>
      </defs>
      <ellipse cx="16" cy="16" rx="14.2" ry="5.4" transform="rotate(-30 16 16)" stroke="url(#quasar-gradient)" stroke-width="1.6" opacity=".75"/>
      <circle cx="16" cy="16" r="6.2" fill="url(#quasar-gradient)"/>
      <circle cx="16" cy="16" r="2.1" fill="#fff"/>
    </svg>
    <div class="wordmark">Quasar</div>
  </header>

  <div class="quasar" aria-hidden="true">
    <div class="jet jet-left"></div>
    <div class="jet jet-right"></div>
    <div class="orbit orbit-b"></div>
    <div class="orbit orbit-a"></div>
    <div class="disc"></div>
    <div class="core"></div>
    <div class="scanline"></div>
  </div>

  <section class="status">
    <h1><span class="verb">Establishing</span><span class="stage">connection</span></h1>
    <div class="status-foot">
      <ol class="progress-rail" aria-label="Connection progress">
        <li class="step" data-state="active">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle class="arc" cx="12" cy="5" r="2"/><circle class="arc" cx="5" cy="19" r="2"/><circle class="arc" cx="19" cy="19" r="2"/><path d="M12 7v4M5 17v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></svg>
          <span class="sr">Signalling</span>
        </li>
        <span class="link" data-state="idle"></span>
        <li class="step" data-state="idle">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.4" y="10.6" width="13.2" height="9" rx="2"/><path class="shackle" d="M8.6 10.6V8.2a3.4 3.4 0 0 1 6.8 0v2.4"/></svg>
          <span class="sr">Secure path</span>
        </li>
        <span class="link" data-state="idle"></span>
        <li class="step" data-state="idle">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path class="play" d="m10 8 6 4-6 4z"/><path class="arc" d="M5.6 6.1a8 8 0 0 0 0 11.8"/><path class="arc" d="M18.4 6.1a8 8 0 0 1 0 11.8"/></svg>
          <span class="sr">Video channel</span>
        </li>
        <span class="link" data-state="idle"></span>
        <li class="step" data-state="idle">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8h7a5 5 0 0 1 4.8 3.6l1.1 3.8a3 3 0 0 1-5.1 2.8L14.5 16h-5l-1.8 2.2a3 3 0 0 1-5.1-2.8l1.1-3.8A5 5 0 0 1 8.5 8Z"/><path class="key" d="M7 11v4M5 13h4"/><path class="key key-b" d="M16.5 12h.01M18.5 14h.01"/></svg>
          <span class="sr">Input capture</span>
        </li>
      </ol>
    </div>
  </section>
</main>
<div class="aperture" aria-hidden="true"></div>

<script>
const stages=["connection","secure path","video channel","your stream"];
const stage=document.querySelector(".stage");
const verb=document.querySelector(".verb");
const steps=[...document.querySelectorAll(".step")];
const links=[...document.querySelectorAll(".link")];
const replay=document.querySelector(".replay");
const loader=document.querySelector(".scene");
const streamUI=document.querySelector(".stream-ui");
let stageIndex=0,stageTimer,transitionTimer,streamTimer,hasConnected=false;

/* The stage word and the step list read from one index, so the headline and the
   checklist can never disagree about where the handshake is. */
function paintSteps(){
  steps.forEach((li,i)=>li.dataset.state=i<stageIndex?"done":i===stageIndex?"active":"idle");
  links.forEach((l,i)=>l.dataset.state=i<stageIndex?"done":i===stageIndex?"active":"idle");
}
function advanceStage(){
  stage.classList.add("changing");
  window.setTimeout(()=>{
    stageIndex=(stageIndex+1)%stages.length;
    stage.textContent=stages[stageIndex];
    stage.classList.remove("changing");
    paintSteps();
  },110);
}
function beginConnection(){
  document.body.classList.remove("is-locking","is-streaming");
  document.getAnimations().forEach(a=>{a.cancel();a.play();});
  window.clearInterval(stageTimer);window.clearTimeout(transitionTimer);window.clearTimeout(streamTimer);
  hasConnected=false;stageIndex=0;
  verb.textContent="Establishing";
  stage.textContent=stages[0];
  paintSteps();
  loader.removeAttribute("inert");loader.setAttribute("aria-hidden","false");
  streamUI.setAttribute("inert","");streamUI.setAttribute("aria-hidden","true");
  stageTimer=window.setInterval(advanceStage,1200);
  transitionTimer=window.setTimeout(completeConnection,6200);
}
function completeConnection(){
  if(hasConnected)return;
  hasConnected=true;
  window.clearInterval(stageTimer);
  stage.classList.add("changing");
  window.setTimeout(()=>{
    verb.textContent="Opening";
    stage.textContent="your stream";
    stage.classList.remove("changing");
    steps.forEach(li=>li.dataset.state="done");
    links.forEach(l=>l.dataset.state="done");
    document.body.classList.add("is-locking");
  },110);
  streamTimer=window.setTimeout(()=>{
    document.body.classList.add("is-streaming");
    loader.setAttribute("inert","");loader.setAttribute("aria-hidden","true");
    streamUI.removeAttribute("inert");streamUI.setAttribute("aria-hidden","false");
  },1180);
}
replay.addEventListener("click",beginConnection);
beginConnection();
</script>
</body>
</html>
