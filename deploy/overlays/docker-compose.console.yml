# Console mode overlay — apply on top of the base stack, and the vendor overlay
# when there is one:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.nvidia.yml \
#                  -f deploy/overlays/docker-compose.console.yml up -d
#
# Console mode puts a desktop on the monitor plugged into this host. The console
# session's own container drives the display (ADR 0009): the node agent hands it
# the GPU's card node, the input devices, the sound device and the host's udev
# data, and the desktop inside holds the screen and the host's raw input. The
# agent itself only launches, watches and stops that session, so this overlay
# gives it what that takes and nothing the desktop holds: the console terminal,
# the i2c nodes for monitor power over DDC, and whether the host has udev data,
# which it cannot read itself. It needs no capability; its DRM read access comes
# from the base file's /dev/dri.
#
# A stream-only deployment omits this file entirely.

services:
  quasar-node-agent:
    environment:
      # Whether this host has udev's device database (/run/udev/data), which a console
      # session's container is given read-only; the agent's console_udev check reads it
      # here. Set 0 on a host without systemd-udevd.
      QUASAR_HOST_UDEV_DATA: "1"
      # No sound fact: the agent sees whether the host has /dev/snd, which a console
      # session's container is given, through the base file's read-only /dev:/host/dev.
    devices:
      # Console mode's own virtual terminal (#407): the agent makes it the active VT with
      # the kernel keyboard off for a console session's life, so nothing typed in a
      # session reaches a host login prompt. A host without VTs (CONFIG_VT off) has no
      # /dev/tty8 and needs a local overlay without this entry.
      - /dev/tty8:/dev/tty8:rw
    device_cgroup_rules:
      - 'c 89:* rmw'   # i2c-dev (major 89) — DDC/CI monitor power detection (VCP 0xd6).
                       # Host must `modprobe i2c-dev`; the agent mknod's /dev/i2c-N itself.
