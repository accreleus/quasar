# The per-session audio daemon (#392), baked into the node-agent image at
# /etc/pipewire/quasar-session.conf and started by node-agent/src/session/audio.rs.
# PipeWire plus a policy-only WirePlumber and the PulseAudio protocol
# (quasar-session-pulse.conf): apps see the same Pulse socket and devices as before.
# No sound card, no D-Bus, no network.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    # The Opus wire format. The sinks are pinned to it too; no client can move the graph (#351).
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    mem.allow-mlock = false
    support.dbus = false
}

# Stock PipeWire's VM floor: small quanta crackle under VM timer jitter, and this daemon
# has no RT priority. Guarded by both_configs_keep_the_stock_vm_quantum_floor (session/audio.rs).
context.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = { update-props = { default.clock.min-quantum = 1024 } }
    }
]

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]

context.objects = [
    { factory = metadata args = { metadata.name = default } }
    # The graph's clock: a monotonic timer, since there is no device to drive it.
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }
]

context.exec = [
    # Links app and capture streams to the session's devices; without it nothing plays.
    { path = "/usr/bin/wireplumber" args = "-p quasar-session" }
    { path = "/usr/bin/pipewire" args = "-c /etc/pipewire/quasar-session-pulse.conf" }
]
