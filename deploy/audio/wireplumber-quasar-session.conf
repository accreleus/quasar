# WirePlumber profile for the per-session audio daemon (quasar-session.conf), baked at
# /etc/wireplumber/wireplumber.conf.d/quasar-session.conf. Inert unless started with
# `-p quasar-session`. Linking and default-device policy only: no hardware monitors, and
# stateless, because its state dir would be HOME, the session's shared socket dir.
context.properties = {
  # module-rt cannot reach rtkit without D-Bus and says so at error level on every start,
  # crowding the daemon output the agent logs when the socket never appears.
  log.level = "2,mod.rt:0"
}

wireplumber.profiles = {
  quasar-session = {
    inherits = [ policy, mixin.systemwide-session, mixin.stateless ]
    # D-Bus and everything that needs it, so nothing logs its absence.
    support.dbus = disabled
    support.system-dbus = disabled
    support.modem-manager = disabled
    support.mpris = disabled
    api.notifications = disabled
    hooks.device.profile.find-voice-call = disabled
    hooks.linking.pause-playback = disabled
  }
}
