# The PulseAudio protocol for the per-session audio daemon (quasar-session.conf), baked
# at /etc/pipewire/quasar-session-pulse.conf. Device names are pinned by the agent:
# guarded by device_name_constants_agree_with_the_baked_config (session/audio.rs).
context.properties = {
    mem.allow-mlock = false
    support.dbus = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]

pulse.properties = {
    # Relative to PULSE_RUNTIME_PATH, which the agent sets to <socket dir>/.runtime, so the
    # socket is <socket dir>/native: the path apps are given and the SELinux rule covers.
    # unrestricted is PulseAudio's auth-anonymous=1. The socket dir is session-private, and
    # cookie auth cannot cross the pressure-vessel (Proton) sandbox.
    server.address = [ { address = "unix:../native" client.access = "unrestricted" } ]
}

# Runs after the socket is listening, so a client can connect a few ms before these exist.
# A stream naming a device that is not there yet is linked to it when it appears.
pulse.cmd = [
    # device.class=sound: Steam hides `abstract` devices from its pickers. priority.session
    # keeps quasar_output the default sink whatever order the devices are seen in.
    { cmd = "load-module"
      args = "module-null-sink sink_name=quasar_output rate=48000 channels=2 sink_properties=\"device.class='sound' device.description='Quasar Output' priority.session=2000\"" }
    # The microphone feed: the agent's decoded client mic plays into it.
    { cmd = "load-module"
      args = "module-null-sink sink_name=quasar_mic rate=48000 channels=2 sink_properties=\"device.class='sound' device.description='Quasar Microphone Feed' priority.session=1000\"" }
    # Its monitor as a first-class capture source: Steam and many games hide monitors.
    { cmd = "load-module"
      args = "module-remap-source master=quasar_mic.monitor source_name=quasar_mic_src source_properties=\"device.class='sound' device.description='Quasar Microphone'\"" }
]
